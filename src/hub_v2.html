<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EKA Knowledge Hub v2</title>
<style>
  @font-face { font-family: "Fredoka"; font-weight: 500; src: url("../node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fredoka"; font-weight: 600; src: url("../node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2") format("woff2"); }

  :root {
    --navy: #0A1F44;      /* dark blue */
    --navy-deep: #061331;
    --navy-mid: #16336B;
    --blue: #2A5BD7;
    --green: #6CC24A;     /* Maxis-style green */
    --green-dark: #3E8E2A;
    --green-tint: #EDF8E8;
    --white: #FFFFFF;
    --ink: #0A1F44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: var(--white); }
  .abs { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; inset: 0; }

  #bg { background: radial-gradient(1500px 1000px at 72% 38%, #17397A 0%, var(--navy) 55%, var(--navy-deep) 100%); }
  #grid { background-image: radial-gradient(rgba(255,255,255,.13) 1.6px, transparent 2px); background-size: 46px 46px; }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); }
  .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.07); }
  .deco { position: absolute; }

  /* EKA */
  #eka { position: absolute; width: 883px; height: 1517px; transform-origin: 441px 1497px; }
  #eka img { position: absolute; left: 0; top: 0; width: 883px; height: 1517px; }
  #ekaArm { transform-origin: 700px 807px; }
  .lid { position: absolute; border-radius: 50%; overflow: hidden; }
  .lid > div { width: 100%; height: 100%; background: linear-gradient(#e9ecef, #f6f7f6 80%, #cfd8e0); transform-origin: 50% 0; transform: scaleY(0); }
  #mouthCover { position: absolute; left: 326px; top: 468px; width: 150px; height: 56px; border-radius: 50%; background: #f7f8f6; filter: blur(2px); }
  #mouth { position: absolute; left: 368px; top: 494px; width: 66px; height: 10px; border-radius: 10px 10px 40px 40px; background: #08162F;
    border: 4px solid #5BC23A; transform-origin: 50% 0; overflow: hidden; }
  #mouth i { position: absolute; left: 14px; right: 14px; bottom: -6px; height: 16px; border-radius: 50%; background: #4FB82F; }
  #chestGlow { position: absolute; left: 280px; top: 650px; width: 140px; height: 90px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(170,255,150,.95), rgba(90,220,90,.35) 60%, rgba(90,220,90,0)); mix-blend-mode: screen; }
  #ekaShadow { position: absolute; width: 440px; height: 50px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.5), rgba(0,0,0,0)); }
  #ekaHalo { position: absolute; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(closest-side, rgba(108,194,74,.35), rgba(108,194,74,0)); }

  .bubble { position: absolute; background: #fff; border-radius: 34px; padding: 20px 32px; font: 600 44px "Fredoka"; color: var(--navy);
    box-shadow: 0 14px 34px rgba(0,0,0,.3); white-space: nowrap; transform-origin: 0% 100%; }
  .bubble::after { content: ""; position: absolute; left: 34px; bottom: -22px; border: 16px solid transparent; border-top: 22px solid #fff; border-bottom: 0; }
  .bubble.lft { transform-origin: 100% 100%; }
  .bubble.lft::after { left: auto; right: 34px; }
  .bubble b { color: var(--green-dark); }

  .kicker { font: 700 26px "Space Grotesk"; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
  .pill { display: inline-block; padding: 12px 26px; border-radius: 40px; border: 2px solid rgba(108,194,74,.6); background: rgba(108,194,74,.12); }
  .hl { position: relative; display: inline-block; color: var(--navy); }
  .hl > i { position: absolute; left: -14px; right: -14px; top: 8%; bottom: 2%; background: var(--green); border-radius: 16px; transform-origin: 0 50%; z-index: -1; }

  /* cards */
  .card { position: absolute; left: 640px; top: 74px; width: 1210px; height: 770px; background: #fff; border-radius: 44px;
    box-shadow: 0 40px 80px rgba(0,0,0,.35); overflow: hidden; color: var(--ink); }
  .card .bar { position: absolute; left: 0; right: 0; top: 0; height: 14px; background: linear-gradient(90deg, var(--green), #A4DB8A); }
  .card .iconWrap { position: absolute; left: 56px; top: 74px; width: 360px; height: 360px; border-radius: 50%; background: #EAF0FA; }
  .card .iconWrap svg { position: absolute; left: -20px; top: -20px; width: 400px; height: 400px; overflow: visible; }
  .card .num { position: absolute; left: 60px; top: 470px; font: 700 150px/1 "Space Grotesk"; letter-spacing: -.04em; color: var(--green); }
  .card .of { position: absolute; left: 66px; top: 628px; font: 700 23px "Space Grotesk"; letter-spacing: .14em; color: #7d8aa3; }
  .card .right { position: absolute; left: 470px; top: 70px; width: 690px; }
  .card .title { font: 600 96px/1.02 "Fredoka"; color: var(--navy); }
  .card .what { margin-top: 24px; font: 500 44px/1.28 "Inter"; color: #1E3358; }
  .card .why { position: relative; margin-top: 40px; padding: 28px 32px 30px 112px; border-radius: 28px; background: var(--green-tint); transform-origin: 0 50%; }
  .card .why .lab { font: 700 24px "Space Grotesk"; letter-spacing: .14em; color: var(--green-dark); margin-bottom: 10px; }
  .card .why .txt { font: 500 38px/1.3 "Inter"; color: var(--navy); }
  .card .why .bulb { position: absolute; left: 26px; top: 28px; width: 64px; height: 64px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }
  .card.dark { background: var(--navy-deep); box-shadow: 0 0 0 4px var(--green), 0 40px 90px rgba(0,0,0,.5), 0 0 120px rgba(108,194,74,.35); }
  .card.dark .title { color: #fff; }
  .card.dark .what { color: #D5E2F7; }
  .card.dark .iconWrap { background: #13295A; }
  .card.dark .why { background: rgba(108,194,74,.16); }
  .card.dark .why .txt { color: #fff; }
  .card.dark .why .lab { color: var(--green); }
  .card.dark .of { color: #7f93b8; }

  .chip { position: absolute; top: 884px; width: 140px; height: 128px; border-radius: 26px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; border: 3px dashed rgba(255,255,255,.28); color: rgba(255,255,255,.55); transform-origin: 50% 100%; }
  .chip b { font: 700 38px "Space Grotesk"; line-height: 1; }
  .chip span { font: 600 18px "Fredoka"; margin-top: 6px; white-space: nowrap; }
  .chip .fill { position: absolute; inset: -3px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--green); color: var(--navy); box-shadow: 0 10px 0 #3E8E2A, 0 0 40px rgba(108,194,74,.5); }
  .chip .done { position: absolute; right: -12px; top: -12px; width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  .chip.past .fill { background: #fff; box-shadow: 0 10px 0 #b8c4d8; }

  .chat { position: absolute; padding: 20px 26px; border-radius: 26px; font: 600 29px/1.2 "Fredoka"; white-space: nowrap; }
  .spark { position: absolute; width: 40px; height: 40px; }

  .brick { position: absolute; width: 220px; height: 136px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.16), 0 14px 26px rgba(0,0,0,.3); }
  .brick b { font: 700 46px "Space Grotesk"; line-height: 1; }
  .brick span { font: 600 25px "Fredoka"; margin-top: 6px; }
  .found { position: absolute; padding: 18px 30px 18px 76px; border-radius: 40px; background: #fff; color: var(--navy); font: 600 38px "Fredoka"; white-space: nowrap;
    box-shadow: 0 14px 30px rgba(0,0,0,.3); }
  .found i { position: absolute; left: 18px; top: 50%; margin-top: -22px; width: 44px; height: 44px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }
  .conf { position: absolute; width: 18px; height: 28px; border-radius: 4px; }
  .band { position: absolute; top: -200px; height: 1480px; width: 2500px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="glows" class="layer"></div>
  <div id="grid" class="layer"></div>
  <div id="rings" class="layer"></div>
  <div id="decos" class="layer"></div>

  <div id="sIntro" class="layer"></div>
  <div id="sBlocks" class="layer"></div>
  <div id="sRecap" class="layer"></div>
  <div id="sClose" class="layer"></div>

  <div id="ekaHalo"></div>
  <div id="ekaShadow"></div>
  <div id="eka">
    <img id="ekaBody" src="../assets/eka2_body.png">
    <img id="ekaArm" src="../assets/eka2_arm.png">
    <div id="chestGlow"></div>
    <div class="lid" style="left:160px; top:287px; width:172px; height:190px"><div></div></div>
    <div class="lid" style="left:455px; top:232px; width:195px; height:215px"><div></div></div>
    <div id="mouthCover"></div>
    <div id="mouth"><i></i></div>
  </div>
  <div id="fx" class="layer"></div>
  <div id="bubbles" class="layer"></div>
  <div id="wipe" class="layer"></div>
</div>

<script src="timeline_v2.js"></script>
<script src="vo_env_v2.js" onerror="window.VO_ENV = null"></script>
<script>
/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inCubic: p => p * p * p,
  inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outBack: p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  outBounce: p => { const n1 = 7.5625, d1 = 2.75;
    if (p < 1 / d1) return n1 * p * p;
    if (p < 2 / d1) return n1 * (p -= 1.5 / d1) * p + .75;
    if (p < 2.5 / d1) return n1 * (p -= 2.25 / d1) * p + .9375;
    return n1 * (p -= 2.625 / d1) * p + .984375; },
};
const tw = (t, a, b, from, to, ease = E.outCubic) => lerp(from, to, ease(prog(t, a, b)));
function rng(seed) { seed = (seed * 2654435761) % 2147483647 || 1; return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
function put(e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1 }) {
  e.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${(sx ?? s).toFixed(4)}, ${(sy ?? s).toFixed(4)})`;
  e.style.opacity = clamp(o).toFixed(3);
  e.style.visibility = o <= 0.001 ? "hidden" : "visible";
}
const vis = (e, on) => { e.style.display = on ? "" : "none"; };
const swing = (u, amp, freq = 2.2, damp = 3) => u < 0 ? 0 : amp * Math.exp(-damp * u) * Math.sin(2 * Math.PI * freq * u);
const CHECK = c => `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const BULB = `<svg viewBox="0 0 24 24" width="38" height="38"><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5.8 1.1.8 1.8V17h6v-.9c0-.7.3-1.3.8-1.8A6.5 6.5 0 0 0 12 2.5z" fill="#fff"/><rect x="9" y="18.3" width="6" height="1.8" rx=".9" fill="#fff"/><rect x="10" y="21" width="4" height="1.6" rx=".8" fill="#fff"/></svg>`;
const $ = id => document.getElementById(id);
const G = "#6CC24A", GD = "#3E8E2A", NAVY = "#0A1F44", BLUE = "#2A5BD7";

/* ---------- timeline ---------- */
const TL = window.TL;
const T = { intro: TL.intro, recap: TL.recap, close: TL.closing, end: TL.end, blocks: TL.blocks[0] };
const blockStart = i => TL.blocks[i];
const blockEnd = i => i < 7 ? TL.blocks[i + 1] : TL.recap;

const BLOCKS = [
  { n: "01", title: "Understand", what: "Know your users, their questions, and trusted information sources.",
    why: "A clear purpose helps the hub give the right answers, not just store documents." },
  { n: "02", title: "Content", what: "Keep content accurate, up to date, and easy to find.",
    why: "Copilot can only give good answers when the content behind it is good." },
  { n: "03", title: "Metadata", what: "Add tags, owners, categories and review dates to content.",
    why: "Context helps Copilot find the right information faster and know what to trust." },
  { n: "04", title: "Format", what: "Use clear headings, simple language, and a logical structure.",
    why: "Well-structured content helps Copilot understand it and give better answers." },
  { n: "05", title: "Governance", what: "Assign owners and set review and access rules.",
    why: "Good governance keeps information accurate, secure, and reliable." },
  { n: "06", title: "Automation", what: "Use workflows for reviews, approvals, and updates.",
    why: "Less manual work, and content stays current as the hub grows." },
  { n: "07", title: "Copilot Agent", what: "Connect the agent to trusted content and define its purpose.", dark: true,
    why: "A well-configured agent gives reliable answers and a better user experience." },
  { n: "08", title: "Analytics", what: "Monitor usage, feedback, and unanswered questions.",
    why: "Find the gaps, improve content, and make the hub more valuable over time." },
];

/* ---------- background ---------- */
const glows = [{ c: "rgba(108,194,74,.30)", w: 760, x: 1350, y: -260 }, { c: "rgba(42,91,215,.45)", w: 900, x: -300, y: 500 }, { c: "rgba(108,194,74,.18)", w: 600, x: 1500, y: 760 }]
  .map(b => { const e = el("div", "glow", $("glows")); e.style.width = e.style.height = b.w + "px"; e.style.background = b.c; return { ...b, e }; });
const rings = [420, 640, 860, 1080].map((d, i) => { const e = el("div", "ring", $("rings")); e.style.width = e.style.height = d + "px"; e.style.left = (1250 - d / 2) + "px"; e.style.top = (460 - d / 2) + "px";
  if (i % 2) e.style.borderStyle = "dashed"; return e; });
const R = rng(11);
const decos = [];
for (let i = 0; i < 26; i++) {
  const kind = ["dot", "plus", "ring", "dot"][i % 4];
  const size = 8 + R() * 22, c = i % 3 === 0 ? G : "#FFFFFF";
  const e = el("div", "deco", $("decos"));
  e.style.width = e.style.height = size + "px";
  if (kind === "ring") { e.style.border = `${Math.max(2.5, size / 6)}px solid ${c}`; e.style.borderRadius = "50%"; }
  if (kind === "dot") { e.style.background = c; e.style.borderRadius = "50%"; }
  if (kind === "plus") e.innerHTML = `<svg viewBox="0 0 10 10" width="${size}" height="${size}"><path d="M5 1v8M1 5h8" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;
  decos.push({ e, x: R() * 1920, y: R() * 1080, ph: R() * 6.28, sp: .15 + R() * .35, o: .12 + R() * .3 });
}
function renderBg(t) {
  glows.forEach((b, i) => put(b.e, { x: b.x + 70 * Math.sin(t * .22 + i * 2), y: b.y + 50 * Math.cos(t * .19 + i), o: 1 }));
  rings.forEach((r, i) => put(r, { r: t * (i % 2 ? -4 : 3), s: 1 + .02 * Math.sin(t * .8 + i), o: 1 }));
  decos.forEach(d => put(d.e, { x: d.x + 26 * Math.sin(t * d.sp + d.ph), y: d.y - ((t * 14 * d.sp + d.ph * 100) % 1180) + 1180 * (d.y < 0 ? 1 : 0), o: d.o * (.6 + .4 * Math.sin(t * 2 + d.ph)) }));
  $("grid").style.backgroundPosition = `${(t * 6) % 46}px ${(t * 9) % 46}px`;
}

/* ---------- EKA ---------- */
const EKA_H = 1497; // feet line in the canvas
const BLINKS = [2.3, 6.1, 8.9, 12.4, 15.2, 18.8, 21.6, 24.4, 27.9, 31.3, 33.8, 37.1, 41.9, 44.2, 47.6, 51.0, 54.4, 57.3];
function hop(t, t0, h = 70, dur = .5) {
  const u = t - t0;
  if (u < -.1 || u > dur + .16) return { dy: 0, sx: 1, sy: 1 };
  if (u < 0) { const p = prog(u, -.1, 0); return { dy: 0, sx: 1 + .06 * p, sy: 1 - .07 * p }; }
  if (u < dur) { const p = u / dur; return { dy: -4 * h * p * (1 - p), sx: .97, sy: 1.04 }; }
  const p = prog(u, dur, dur + .16); const k = Math.sin(p * Math.PI);
  return { dy: 0, sx: 1 + .07 * k, sy: 1 - .09 * k };
}
function ekaPose(t) {
  const P = { x: 560, y: 1050, s: .6, r: 0, sx: 1, sy: 1, dy: 0, arm: 0, glow: .3, halo: 0 };
  const idle = Math.sin(t * 2 * Math.PI / 1.8);
  P.dy = -6 * idle; P.r = 1.0 * Math.sin(t * 1.2);
  P.arm = 2.5 * Math.sin(t * 2.4);
  const hops = [], jabs = [];
  if (t < T.blocks) {
    const p = prog(t, .25, .78);
    P.dy = t < .78 ? lerp(-1500, 0, E.inCubic(p)) : P.dy * prog(t, 1.2, 1.6);
    if (t >= .78 && t < 1.05) { const k = Math.sin(prog(t, .78, 1.05) * Math.PI); P.sx = 1 + .13 * k; P.sy = 1 - .15 * k; }
    if (t < .78) P.r = 0;
    jabs.push(1.1, 1.6, 2.6);
    hops.push(3.9);
  } else if (t < T.recap) {
    P.x = 330; P.s = .55;
    for (let i = 0; i < 8; i++) { hops.push(blockStart(i) + .05); jabs.push(blockStart(i) + .7, blockStart(i) + 2.25); }
    const a7 = blockStart(6), e7 = blockEnd(6);
    const big = prog(t, a7, a7 + .5) * (1 - prog(t, e7 - .5, e7));
    P.s = .55 + .05 * E.outBack(clamp(big));
    P.glow = .3 + .7 * big; P.halo = big;
    hops.push(a7 + 1.9, a7 + 2.45);
  } else if (t < T.close) {
    P.x = 1610; P.s = .48; P.y = 1030;
    const u = t - T.recap;
    hops.push(T.recap + 2.1, T.recap + 2.65, T.recap + 3.2);
    jabs.push(T.recap + 4.2, T.recap + 5.4);
    P.glow = .6; P.halo = prog(u, 2, 2.5) * .7;
  } else {
    P.x = 1480 + tw(t, T.close, T.close + .6, 520, 0, E.outBack); P.s = .62; P.y = 1060;
    jabs.push(T.close + 1.0, T.close + 3.2, T.close + 5.2);
    hops.push(T.close + 4.6);
    P.glow = .5 + .5 * Math.max(0, Math.sin(t * 4)); P.halo = .6;
  }
  hops.forEach(h0 => { const h = hop(t, h0, (t >= T.recap && t < T.close) ? 110 : 60); P.dy += h.dy; P.sx *= h.sx; P.sy *= h.sy; });
  // "Point" emphasis: the forearm dips and snaps back up.
  jabs.forEach(j => { const u = t - j; if (u > 0 && u < .7) P.arm += -14 * Math.sin(Math.PI * Math.min(1, u / .25)) * (u < .25 ? 1 : 0) + swing(u - .25, -6, 3, 6); });
  return P;
}
function voLevel(t) {
  const V = window.VO_ENV; if (!V) return 0;
  const f = t * V.fps, i = Math.floor(f), k = f - i;
  const a = V.v[i] || 0, b = V.v[i + 1] || 0; return a + (b - a) * k;
}
function renderEka(t) {
  const P = ekaPose(t);
  const eka = $("eka");
  eka.style.left = (P.x - 441) + "px"; eka.style.top = (P.y - EKA_H) + "px";
  put(eka, { y: P.dy, r: P.r, sx: P.s * P.sx, sy: P.s * P.sy, o: 1 });
  $("ekaArm").style.transform = `rotate(${P.arm.toFixed(2)}deg)`;
  const lift = clamp(-P.dy / 400);
  const sh = $("ekaShadow"); sh.style.left = (P.x - 220) + "px"; sh.style.top = (P.y - 22) + "px";
  put(sh, { sx: P.s * 1.6 * (1 - .45 * lift), sy: P.s * 1.6 * (1 - .45 * lift), o: (1 - .7 * lift) * (P.dy > -1200 ? 1 : 0) });
  const halo = $("ekaHalo"); halo.style.left = (P.x - 380) + "px"; halo.style.top = (P.y - 640 * P.s / .55 - 380) + "px";
  put(halo, { s: (.9 + .1 * Math.sin(t * 5)) * P.s / .55, o: P.halo });
  let b = 0;
  BLINKS.forEach(t0 => { const u = t - t0; if (u >= 0 && u < .2) b = u < .07 ? u / .07 : 1 - (u - .07) / .13; });
  document.querySelectorAll(".lid > div").forEach(l => l.style.transform = `scaleY(${b.toFixed(3)})`);
  $("chestGlow").style.opacity = clamp(P.glow * (.75 + .25 * Math.sin(t * 6)));
  // Lip-sync from the voice-over envelope (when one has been supplied).
  const v = clamp(voLevel(t) * 1.4);
  $("mouthCover").style.opacity = v > .04 ? 1 : 0;

    const on = u7 > .3 && u7 < l7 - .4;
    put(s, { x: 330 + rad * Math.cos(ang) - 20, y: 640 + rad * .95 * Math.sin(ang) - 20, s: on ? (.6 + .5 * Math.abs(Math.sin(u7 * 4 + k))) * prog(u7, .3 + k * .05, .6 + k * .05) * (1 - prog(u7, l7 - .7, l7 - .4)) : 0, r: u7 * 90, o: on ? 1 : 0 });
  });
}

/* ---------- recap: blocks stack into the hub ---------- */
const sRecap = $("sRecap");
const rHead = el("div", "abs", sRecap, `A successful <span style="color:var(--green)">Knowledge Hub</span><br>starts with three foundations`);
rHead.style.cssText += "left:110px;top:58px;font:600 70px/1.12 Fredoka;color:#fff;white-space:nowrap";
const roof = el("div", "abs", sRecap, `<svg viewBox="0 0 980 250" width="980" height="250"><path d="M490 10 L970 240 H10 Z" fill="#fff" stroke="#fff" stroke-width="16" stroke-linejoin="round"/>
  <text x="490" y="196" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="52" fill="${NAVY}">Enterprise Knowledge Hub</text><circle cx="490" cy="100" r="28" fill="${G}"/></svg>`);
roof.style.left = "130px"; roof.style.top = "318px";
const bricks = BLOCKS.map((B, i) => { const b = el("div", "brick", sRecap, `<b>${B.n}</b><span>${B.title.replace("Copilot ", "")}</span>`);
  const green = (i + Math.floor(i / 4)) % 2 === 0;
  b.style.background = green ? G : "#1E4A9E"; b.style.color = green ? NAVY : "#fff";
  b.style.left = (160 + (i % 4) * 232) + "px"; b.style.top = (572 + Math.floor(i / 4) * 150) + "px"; return b; });
const floor = el("div", "abs", sRecap); floor.style.cssText += "left:110px;top:874px;width:1020px;height:22px;border-radius:11px;background:rgba(255,255,255,.25)";
const FOUND = ["Trusted content", "Clear governance", "Continuous improvement"].map((s, k) => { const f = el("div", "found", sRecap, `<i>${CHECK(NAVY)}</i>${s}`); f.style.left = (110 + k * 0) + "px"; return f; });
const CONF = [...Array(90)].map((_, k) => { const r = rng(300 + k); const e = el("div", "conf", $("fx")); e.style.background = [G, "#fff", "#5B8DEF"][k % 3];
  return { e, vx: (r() - .5) * 1500, vy: -600 - r() * 900, spin: (r() - .5) * 1400, t0: T.recap + 2.0 + (k % 3) * .55, x0: k % 2 ? 620 : 1600, y0: k % 2 ? 420 : 640 }; });
function renderRecap(t) {
  const u = t - T.recap, len = T.close - T.recap;
  put(rHead, { y: tw(u, .2, .6, 40, 0, E.outBack), o: prog(u, .2, .4) });
  put(floor, { sx: E.outCubic(prog(u, .1, .5)), sy: 1, o: 1 });
  const order = [4, 5, 6, 7, 0, 1, 2, 3];
  bricks.forEach((b, i) => { const a = .35 + order.indexOf(i) * .14, p = prog(u, a, a + .42);
    put(b, { y: lerp(-900, 0, E.outBounce(p)), r: lerp(i % 2 ? 12 : -12, 0, E.outCubic(p)), o: p > 0 ? 1 : 0 }); });
  const rp = prog(u, 1.65, 2.1);
  put(roof, { y: lerp(-700, 0, E.outBounce(rp)), o: rp > 0 ? 1 : 0 });
  // The three foundations slide in at the top once the house is built.
  FOUND.forEach((f, k) => { const a = 3.6 + k * .55; f.style.left = [110, 520, 940][k] + "px"; f.style.top = "232px";
    put(f, { y: tw(u, a, a + .45, -60, 0, E.outBack), s: tw(u, a, a + .45, .6, 1, E.outBack), o: prog(u, a, a + .15) * (1 - prog(u, len - .2, len)) }); });
}
function renderConfetti(t) {
  CONF.forEach(c => { const u = t - c.t0, on = u > 0 && u < 2.6;
    put(c.e, { x: c.x0 + c.vx * u, y: c.y0 + c.vy * u + 1400 * u * u, r: c.spin * u, sx: Math.cos(u * 9 + c.spin), sy: 1, o: on ? 1 - prog(u, 2.0, 2.6) : 0 }); });
}

/* ---------- closing ---------- */
const sClose = $("sClose");
const cKick = el("div", "abs pill kicker", sClose, "The result");
cKick.style.cssText += "left:120px;top:170px";
const cL1 = el("div", "abs", sClose, "When the foundations are in place,");
cL1.style.cssText += "left:120px;top:250px;font:500 48px Inter;color:#C9D6EE;white-space:nowrap";
const cL2 = el("div", "abs", sClose, `<span style="color:var(--green)">Copilot</span> delivers<br>accurate knowledge`);
cL2.style.cssText += "left:116px;top:330px;font:600 108px/1.06 Fredoka;color:#fff;white-space:nowrap";
const cL3 = el("div", "abs", sClose, `<span class="hl"><i></i>&amp; helps people work smarter.</span>`);
cL3.style.cssText += "left:130px;top:600px;font:600 64px Fredoka;white-space:nowrap";
const cFoot = el("div", "abs", sClose, `Building an Enterprise Knowledge Hub · presented by EKA`);
cFoot.style.cssText += "left:124px;top:940px;font:700 28px 'Space Grotesk';letter-spacing:.05em;color:#8FA6CF";
const cIcons = ["Trusted content", "Clear governance", "Continuous improvement"].map((s, k) => { const e = el("div", "abs", sClose, `${CHECK(G)}<span>${s}</span>`);
  e.style.cssText += `left:${124 + k * 350}px;top:790px;display:flex;gap:12px;align-items:center;font:600 32px Fredoka;color:#fff;white-space:nowrap`; return e; });
const cFade = el("div", "layer", $("wipe")); cFade.style.background = "#061331";
function renderClose(t) {
  const u = t - T.close;
  put(cKick, { y: tw(u, .45, .85, 30, 0, E.outBack), o: prog(u, .45, .75) });
  put(cL1, { y: tw(u, .6, 1.0, 30, 0), o: prog(u, .6, .9) });
  put(cL2, { y: tw(u, 1.0, 1.5, 60, 0, E.outBack), o: prog(u, 1.0, 1.3) });
  put(cL3, { y: tw(u, 2.4, 2.8, 40, 0, E.outBack), o: prog(u, 2.4, 2.6) });
  cL3.querySelector("i").style.transform = `scaleX(${E.outCubic(prog(u, 2.6, 3.1)).toFixed(3)})`;
  cIcons.forEach((e, k) => { const a = 3.4 + k * .3; put(e, { y: tw(u, a, a + .4, 30, 0, E.outBack), o: prog(u, a, a + .2) }); });
  put(cFoot, { y: tw(u, 4.6, 5.0, 20, 0), o: prog(u, 4.6, 4.9) });
}

/* ---------- wipes ---------- */
const WIPES = [T.blocks, T.recap, T.close];
const bands = ["#1E4A9E", "#FFFFFF", G].map(c => { const b = el("div", "band", $("wipe")); b.style.background = c; return b; });
function renderWipe(t) {
  bands.forEach((b, k) => {
    let x = 4000;
    WIPES.forEach(B => {
      const lead = (2 - k) * .07, a = B - .42 - lead, m = B - .04, c = B + .04 + lead * .6, d = B + .44 + lead * .6;
      if (t >= a && t <= d) x = t < m ? lerp(2000, -260, E.outCubic(prog(t, a, m))) : t < c ? -260 : lerp(-260, -2900, E.inCubic(prog(t, c, d)));
    });
    b.style.transform = `translateX(${x.toFixed(1)}px) skewX(-14deg)`;
  });
}

/* ---------- master ---------- */
function render(t) {
  renderBg(t);
  vis(sIntro, t < T.blocks); vis(sBlocks, t >= T.blocks && t < T.recap); vis(sRecap, t >= T.recap && t < T.close); vis(sClose, t >= T.close);
  if (t < T.blocks) renderIntro(t);
  else if (t < T.recap) renderBlocks(t);
  else if (t < T.close) renderRecap(t);
  else renderClose(t);
  if (!(t >= T.blocks && t < T.recap)) SPARKS.forEach(s => put(s, { o: 0 }));
  renderEka(t);
  renderBubbles(t);
  renderConfetti(t);
  renderWipe(t);
  cFade.style.opacity = prog(t, T.end - .6, T.end).toFixed(3);
}
window.render = render;
window.DURATION = T.end;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))])
  .then(() => Promise.all(["600 40px Fredoka", "500 40px Fredoka", "700 40px 'Space Grotesk'", "500 40px Inter"].map(f => document.fonts.load(f))))
  .then(() => { render(0); return true; });
if (location.hash === "#play") { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % T.end); requestAnimationFrame(loop); }; window.ready.then(loop); }
</script>
</body>
