    put(S.dodge, { sx: E.outBack(prog(u, DODGE_U, DODGE_U + .4)), sy: 1, x: -260 * oe, o: prog(u, DODGE_U, DODGE_U + .12) * (1 - out) });
    put(S.dTxt, { x: tw(u, DODGE_U + .2, DODGE_U + .55, 30, 0), o: prog(u, DODGE_U + .2, DODGE_U + .45) });
    put(S.dIco, { s: E.outBack(prog(u, DODGE_U + .1, DODGE_U + .45)), r: tw(u, DODGE_U + .1, DODGE_U + .45, -60, 0) });
    const st = prog(u, DODGE_U + .45, DODGE_U + .7);
    put(S.stamp, { s: lerp(2.4, 1, E.outCubic(st)), r: -12, o: st * (1 - prog(u, DODGE_U + 1.7, DODGE_U + 2.0)) * (1 - out) });
  });
}

/* ---------- recap: how to dodge every trap ---------- */
const sRecap = $("sRecap");
const rHead = el("div", "abs", sRecap, `How to <span style="color:#6CC24A">dodge</span> every trap`);
rHead.style.cssText += "left:880px;top:96px;font:600 76px Fredoka;white-space:nowrap";
const ROWS = TRAPS.map((S, k) => { const r = el("div", "row", sRecap, `<i>${CHECK("#0A1F44")}</i>${S.short}<s>${S.dodge}</s>`); r.style.top = (236 + k * 106) + "px"; return r; });
const sparks = Array.from({ length: 14 }, (_, k) => el("div", "spark", $("fx"), STAR(k % 2 ? G : "#fff")));
function renderRecap(t) {
  const u = t - T.recap;
  put(rHead, { x: tw(u, .1, .5, 80, 0, E.outBack), o: prog(u, .1, .3) });
  const at = TL.fixes || TRAPS.map((_, k) => 1.6 + k * .9);
  ROWS.forEach((r, k) => { put(r, { x: tw(u, at[k], at[k] + .4, 120, 0, E.outBack), o: prog(u, at[k], at[k] + .12) });
    put(r.querySelector("i"), { s: E.outBack(prog(u, at[k] + .05, at[k] + .4)), r: tw(u, at[k], at[k] + .4, -90, 0) }); });
}
function renderSparks(t) {
  const R2 = rng(3);
  const on = t >= T.recap && t < T.close;
  sparks.forEach((s, k) => {
    const ph = R2(), ang = R2() * 6.28, rad = 200 + R2() * 220;
    if (!on) return put(s, { o: 0 });
    const B = ekaBase(t), cx = B.x, cy = B.y - 800 * B.s;
    const cyc = ((t * .9 + ph) % 1);
    put(s, { x: cx + rad * Math.cos(ang + t * .4) - 22, y: cy + rad * Math.sin(ang + t * .4) - 22, s: Math.sin(cyc * Math.PI) * (.6 + .6 * ph), r: t * 90, o: Math.sin(cyc * Math.PI) });
  });
}

/* ---------- closing ---------- */
const sClose = $("sClose");
const cL = [
  { html: "Dodge the traps,", top: 210, f: "600 96px Fredoka" },
  { html: "and your hub becomes", top: 330, f: "600 80px Fredoka" },
  { html: "the place", top: 440, f: "600 80px Fredoka" },
  { html: `<span class="hl"><i></i>everyone trusts!</span>`, top: 548, f: "600 112px Fredoka" },
].map(L => { const e = el("div", "abs", sClose, L.html); e.style.cssText += `left:140px;top:${L.top}px;font:${L.f};color:${L.c || "#fff"};white-space:nowrap;transform-origin:0 70%`; return e; });
const cTag = el("div", "abs", sClose, `Content first · Clear owners · <span style="color:#6CC24A">Keep improving</span>`);
cTag.style.cssText += "left:144px;top:760px;font:700 36px 'Space Grotesk';letter-spacing:.04em;color:#fff;white-space:nowrap";
const cFade = el("div", "layer", $("wipe")); cFade.style.background = "#050F2A"; cFade.style.opacity = 0;
const CONF = Array.from({ length: 70 }, (_, k) => { const R3 = rng(100 + k); const e = el("div", "conf", $("fx"));
  e.style.background = [G, "#fff", BLUE, "#A4DB8A"][k % 4]; return { e, x: R3() * 1920, d: R3() * .8, sp: 420 + R3() * 380, sw: R3() * 6.28, rot: (R3() - .5) * 900 }; });
function renderClose(t) {
  const u = t - T.close;
  cL.forEach((e, k) => { const a = .4 + k * .4; put(e, { x: tw(u, a, a + .5, -80, 0, E.outBack), o: prog(u, a, a + .2) }); });
  put(cL[3].querySelector("i"), { sx: E.outCubic(prog(u, 1.9, 2.4)), sy: 1, o: 1 });
  put(cTag, { y: tw(u, 3.0, 3.4, 30, 0), o: prog(u, 3.0, 3.3) });
}
function renderConfetti(t) {
  CONF.forEach(c => {
    const u = t - (T.close + 1.9 + c.d);
    if (u < 0 || t >= T.end) return put(c.e, { o: 0 });
    put(c.e, { x: c.x + 40 * Math.sin(u * 3 + c.sw), y: -40 + u * c.sp, r: u * c.rot, sx: Math.cos(u * 6 + c.sw), sy: 1, o: 1 - prog(u, 2.6, 3.2) });
  });
}

/* ---------- bubbles ---------- */
const BUBBLES = [
  { text: "Uh-oh!", a: .95, b: 3.6, x: 470, y: 150 },
  { text: "Let's build it <b>right</b>!", a: T.end - 3.0, b: T.end - .5, x: 1080, y: 250, left: true },
];
BUBBLES.forEach(B => { B.e = el("div", "bubble" + (B.left ? " lft" : ""), $("bubbles"), B.text); B.e.style.left = B.x + "px"; B.e.style.top = B.y + "px"; });
function renderBubbles(t) {
  BUBBLES.forEach(B => {
    const on = t >= B.a && t < B.b;
    if (!on) return put(B.e, { o: 0 });
    put(B.e, { s: E.outBack(prog(t, B.a, B.a + .35)) * (1 - E.inCubic(prog(t, B.b - .25, B.b))), r: swing(t - B.a, 4, 2, 4), o: 1 });
  });
}

/* ---------- wipes ---------- */
const WIPES = [T.traps, T.recap, T.close];
const bands = ["#6CC24A", "#FFFFFF", "#16336B"].map(c => { const b = el("div", "band", $("wipe")); b.style.background = c; return b; });
function renderWipe(t) {
  bands.forEach((b, k) => {
    let x = 4000;
    WIPES.forEach(B => {
      const lead = (2 - k) * .07, a = B - .42 - lead, m = B - .04, c = B + .04 + lead * .6, d = B + .44 + lead * .6;
      if (t >= a && t <= d) x = t < m ? lerp(2000, -260, E.outCubic(prog(t, a, m))) : t < c ? -260 : lerp(-260, -2900, E.inCubic(prog(t, c, d)));
    });
    b.style.transform = `translateX(${x.toFixed(1)}px) skewX(-14deg)`;
  });
}

/* ---------- master ---------- */
function render(t) {
  renderBg(t);
  vis(sIntro, t < T.traps); vis(sTraps, t >= T.traps - .1 && t < T.recap); vis(sRecap, t >= T.recap && t < T.close); vis(sClose, t >= T.close);
  if (t < T.traps) renderIntro(t);
  renderTraps(t);
  if (t >= T.recap && t < T.close) renderRecap(t);
  if (t >= T.close) renderClose(t);
  renderOrbit(t);
  renderEka(t);
  renderSparks(t);
  renderBubbles(t);
  renderConfetti(t);
  renderWipe(t);
  cFade.style.opacity = prog(t, T.end - .5, T.end).toFixed(3);
}
window.render = render;
window.DURATION = T.end;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))])
  .then(() => Promise.all(["600 40px Fredoka", "500 40px Fredoka", "700 40px Fredoka", "700 40px 'Space Grotesk'", "500 40px Inter", "600 40px Inter"].map(f => document.fonts.load(f))))
  .then(() => { render(0); return true; });
if (location.hash === "#play") { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % T.end); requestAnimationFrame(loop); }; window.ready.then(loop); }
</script>
</body>
